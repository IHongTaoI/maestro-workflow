name: Contracts

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify multi-host CLI
        run: npm test
      - name: Verify schemas and behavioral contracts
        shell: pwsh
        run: ./scripts/verify-contracts.ps1
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Install dsh-adapter dependencies
        run: npm install
        working-directory: adapters/deepseek-harness
      - name: Typecheck dsh-adapter
        run: npm run typecheck
        working-directory: adapters/deepseek-harness
      - name: Test dsh-adapter
        run: npm test
        working-directory: adapters/deepseek-harness
      - name: Verify dsh-adapter package
        run: npm run test:package
        working-directory: adapters/deepseek-harness
