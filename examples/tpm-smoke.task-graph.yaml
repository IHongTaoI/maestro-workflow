name: tpm-smoke
tasks:
  - id: tpm-smoke
    role: tpm
    description: >-
      Produce a concise TPM smoke-test brief for a proposed `maestro health` command.
      State the goal, in-scope and out-of-scope behavior, three verifiable acceptance
      criteria, and one risk with mitigation. This is a read-only smoke test: do not
      create or modify files.
    acceptance:
      - Return a summary that covers goal, scope, acceptance criteria, and one risk.
      - Include exactly three concrete acceptance criteria.
      - Return artifacts as an empty array because this smoke test creates no files.
      - Return blockers as an empty array if no clarification is required.
